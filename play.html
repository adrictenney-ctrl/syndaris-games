<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c0b0a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <title>Play On Display · Hand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Serif+Display&family=Noto+Sans+Symbols+2&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cards.css?v=50">
  <link rel="stylesheet" href="css/play.css?v=50">
  <link rel="stylesheet" href="css/backgammon.css?v=50">
  <link rel="stylesheet" href="css/sketch.css?v=50">
  <link rel="stylesheet" href="css/chefskiss.css?v=50">
  <link rel="stylesheet" href="css/insidejob.css?v=50">
  <link rel="stylesheet" href="css/crown.css?v=50">
  <link rel="stylesheet" href="css/hollow.css?v=50">
  <link rel="stylesheet" href="css/casino.css?v=50">
  <link rel="stylesheet" href="css/checkers.css?v=50">
  <link rel="stylesheet" href="css/yacht.css?v=50">
  <link rel="stylesheet" href="css/spoons.css?v=50">
  <link rel="stylesheet" href="css/doubt.css?v=50">
  <link rel="stylesheet" href="css/cashout.css?v=50">
  <link rel="stylesheet" href="css/crazy8.css?v=50">
  <link rel="stylesheet" href="css/skyline.css?v=50">
  <link rel="stylesheet" href="css/lowtide.css?v=50">
  <link rel="stylesheet" href="css/duels.css?v=50">
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
</head>
<body>
  <main id="app">
    <section id="s-join" class="screen">
      <img class="mark" src="icon.svg" alt="">
      <h1>Play On Display</h1>
      <p class="sub">Your phone is your private hand.</p>
      <label class="field">Your name
        <input id="name" maxlength="14" autocomplete="nickname" placeholder="e.g. Sam">
      </label>
      <label class="field" id="roomField">Room code
        <input id="room" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD">
      </label>
      <button id="joinBtn" class="primary">Join the table</button>
    </section>

    <section id="s-wait" class="screen">
      <div class="spinner"></div>
      <p id="waitMsg">Connecting to the table…</p>
      <button id="cancelBtn" class="ghost">Back</button>
    </section>

    <section id="s-seat" class="screen">
      <p class="eyebrow" id="seatGame"></p>
      <h2>Where are you sitting?</h2>
      <p class="sub">Pick your spot around the table screen — the open seats say "Open seat" facing you.</p>
      <div class="minitable" id="minitable">
        <div class="mt-felt">TABLE</div>
      </div>
    </section>

    <section id="s-game" class="screen">
      <header class="hud">
        <div class="team" id="hudL"></div>
        <div id="hudC" class="trump"></div>
        <div class="team" id="hudR"></div>
      </header>
      <div id="whoami"></div>
      <div id="board"></div>
      <div id="myHand"></div>
      <div id="status">
        <div id="statusMain"></div>
        <div id="statusSub"></div>
      </div>
      <div id="panel"></div>
      <div id="handWrap"><div id="hand"></div></div>
      <div id="handHint"></div>
    </section>

    <div id="netbar" hidden></div>
    <div id="toast"></div>
  </main>
  <script type="module" src="js/play.js?v=50"></script>
</body>
</html>
