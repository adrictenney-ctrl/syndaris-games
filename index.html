<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b2d1e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <title>Play On Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=DM+Serif+Display&family=Noto+Sans+Symbols+2&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cards.css?v=15">
  <style>
    body { min-height: 100%; padding: 36px 20px 48px; }
    main { max-width: 1040px; margin: 0 auto; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
    h1 { font-family: var(--display); font-weight: 400; color: var(--ivory); font-size: clamp(40px, 7vw, 68px); letter-spacing: .04em; margin: 0; line-height: 1; }
    .tag { font-family: var(--serif); font-style: italic; color: var(--gold-ink); font-size: 19px; margin: 8px 0 0; }
    a.join {
      font-family: var(--display); font-size: 19px; letter-spacing: .04em; text-decoration: none; color: var(--ivory);
      padding: 11px 20px 13px; border: 1px solid var(--gold-faint); border-radius: 8px; background: rgba(8, 28, 19, .35);
    }
    a.join small { display: block; font-family: var(--ui); font-size: 12px; letter-spacing: .04em; color: var(--gold-ink); margin-top: 2px; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-ink); margin: 0 0 14px; }

    /* The shelf: each game is a box, dressed in its own table */
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; }
    .box {
      position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-height: 300px;
      padding: 20px; border-radius: 10px; overflow: hidden; text-decoration: none; color: var(--ivory);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .08);
      transition: transform .2s, box-shadow .2s;
    }
    a.box:hover { transform: translateY(-4px); box-shadow: 0 20px 38px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .14); }
    .box::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, .5)); pointer-events: none; }
    .box > * { position: relative; z-index: 1; }
    .box .cards { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); height: 100px; width: 200px; z-index: 0; }
    .box .cards .card { --cw: 62px; position: absolute; left: 50%; top: 50%; }
    .box h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: .02em; }
    .box p { font-family: var(--serif); font-style: italic; font-size: 16px; color: rgba(245, 238, 221, .8); margin: 4px 0 0; }
    .box .play { margin-top: 14px; font-size: 12px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--brass-hi); }
    .box.soon { cursor: default; opacity: .8; }
    .box.soon .play { color: #7a6c58; }

    .t-euchre { background: radial-gradient(ellipse at 50% 35%, #226a47, #185236 55%, #0b2d1e); }
    .t-holdem { background: radial-gradient(ellipse at 50% 35%, #2c5888, #1c3c64 55%, #0b1b33); }
    .t-veto { background: repeating-linear-gradient(90deg, rgba(40, 18, 4, .4) 0 2px, transparent 2px 64px), linear-gradient(180deg, #9a6438, #7a4826); }
    .t-chess { background: linear-gradient(180deg, #4b2a17, #33190c); }
    .t-chess .cards { background: conic-gradient(#e7cf9e 25%, #8e5b33 0 50%, #e7cf9e 0 75%, #8e5b33 0) 0 0 / 50px 50px; width: 150px; height: 100px; border: 4px solid #5a3218; box-shadow: 0 0 0 1px #c9a55a, 0 8px 18px rgba(0, 0, 0, .5); }
    .cpc { position: absolute; top: 50%; transform: translate(-50%, -50%); font-family: 'Noto Sans Symbols 2', 'Segoe UI Symbol', serif; font-size: 62px; line-height: 1; }
    .cpc.w { color: #faf3e3; -webkit-text-stroke: 1.2px #2a2018; text-shadow: 0 3px 5px rgba(0, 0, 0, .55); }
    .cpc.b { color: #1c1918; -webkit-text-stroke: 1px rgba(245, 232, 205, .65); text-shadow: 0 3px 5px rgba(0, 0, 0, .55); }
    .t-gofish { background: radial-gradient(ellipse at 50% 35%, #2a8796, #145867 55%, #08303d); }
    .t-gofish .pad {
      position: absolute; width: 54px; aspect-ratio: 1; border-radius: 50%; z-index: 0;
      background: radial-gradient(circle at 38% 34%, #7bbd62, #3f7d3a);
      -webkit-mask: conic-gradient(from 25deg, transparent 0 28deg, #000 28deg); mask: conic-gradient(from 25deg, transparent 0 28deg, #000 28deg);
    }
    .t-cooking {
      color: #2a2320;
      background: repeating-linear-gradient(90deg, rgba(0, 0, 0, .1) 0 1px, transparent 1px 44px), repeating-linear-gradient(0deg, rgba(0, 0, 0, .1) 0 1px, transparent 1px 44px), linear-gradient(180deg, #ece5d6, #cfc4ad);
    }
    .t-cooking::after { background: none; }
    .t-cooking p { color: #5c5145; }
    .t-cooking .pot { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); font-size: 74px; z-index: 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Play On Display</h1>
        <p class="tag">Pick a game for the table. Everyone's hand goes on their phone.</p>
      </div>
      <a class="join" href="play.html">Join with my phone<small>Scan the table's code or type its room code</small></a>
    </header>
    <p class="eyebrow">The games</p>
    <div class="shelf" id="shelf"></div>
  </main>
  <script type="module" src="js/tvnav.js?v=15"></script>
  <script type="module">
    import { GAMES } from './js/games.js?v=15';
    import { cardEl } from './js/cards.js?v=15';
    const art = {
      euchre: ['JH', 'JD', 'AH'], holdem: ['AS', 'AH', 'KD'], veto: ['R-7-1', 'T-d2-2', 'W-wild-3'], gofish: ['7C', '7H', '7S'],
    };
    const shelf = document.getElementById('shelf');
    for (const id of ['euchre', 'holdem', 'veto', 'gofish', 'chess']) {
      const G = GAMES[id];
      const box = document.createElement('a');
      box.className = `box t-${id}`;
      box.href = `table.html?game=${id}`;
      box.innerHTML = `${id === 'gofish' ? '<i class="pad" style="left:14px;top:16px"></i><i class="pad" style="right:18px;top:120px;width:38px;rotate:140deg"></i>' : ''}
        <div class="cards"></div><h2>${G.name}</h2><p>${G.blurb}</p><span class="play">Set up the table →</span>`;
      const fan = box.querySelector('.cards');
      if (id === 'chess') fan.innerHTML = '<span class="cpc w" style="left:34%">♚︎</span><span class="cpc b" style="left:66%">♛︎</span>';
      else art[id].forEach((c, i) => {
        const el = cardEl(c);
        el.style.transform = `translate(-50%, -50%) translateX(${(i - 1) * 34}px) rotate(${(i - 1) * 12}deg) translateY(${Math.abs(i - 1) * 6}px)`;
        fan.appendChild(el);
      });
      shelf.appendChild(box);
    }
    // Cooking Up Trouble is waiting on its rulebook.
    const soon = document.createElement('div');
    soon.className = 'box t-cooking soon';
    soon.innerHTML = `<span class="pot">🍲</span><h2>Cooking Up Trouble</h2><p>Party game · coming soon</p><span class="play">Coming soon</span>`;
    shelf.appendChild(soon);
  </script>
</body>
</html>
