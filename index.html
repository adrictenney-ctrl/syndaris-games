<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0c0b0a">
  <meta name="description" content="Card, casino, board and party games for the big screen. Everyone plays from their phone.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <title>Play On Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Serif+Display&family=Noto+Sans+Symbols+2&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cards.css?v=61">
  <style>
    html { background: var(--onyx); }
    body {
      min-height: 100%; color: var(--ivory);
      background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(205, 180, 135, .08), transparent 70%), var(--onyx);
    }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px; }
    .caps { font-family: var(--ui); font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }

    /* ---------- top bar: brand + quick join ---------- */
    .bar {
      position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      background: rgba(12, 11, 10, .78); border-bottom: 1px solid var(--hairline);
    }
    .bar .wrap { display: flex; align-items: center; gap: 18px; height: 68px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ivory); margin-right: auto; }
    .brand img { width: 32px; height: 32px; }
    .brand span { font-family: var(--ui); font-size: 13px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; }
    .join { display: flex; align-items: center; gap: 0; border: 1px solid var(--hairline-hi); border-radius: 999px; padding: 4px 4px 4px 18px; background: rgba(255, 248, 230, .03); }
    .join label { font-family: var(--ui); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin-right: 10px; white-space: nowrap; }
    .join input {
      width: 92px; background: none; border: 0; outline: none; color: var(--ivory);
      font-family: var(--num); font-size: 20px; letter-spacing: .3em; text-transform: uppercase;
    }
    .join input::placeholder { color: rgba(239, 233, 220, .22); }
    .join button {
      font-family: var(--ui); font-size: 11.5px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; cursor: pointer;
      padding: 10px 18px; border: 0; border-radius: 999px; color: #17130c; background: linear-gradient(180deg, var(--champagne-hi), var(--champagne));
    }

    /* ---------- spotlight ---------- */
    .spot {
      position: relative; display: grid; grid-template-columns: 1.15fr 1fr; min-height: 340px; margin: 30px 0 34px;
      border-radius: 20px; overflow: hidden; text-decoration: none; color: var(--ivory);
      background: radial-gradient(ellipse 70% 90% at 28% 50%, color-mix(in srgb, var(--tint) 100%, #fff 6%), var(--tint) 45%, color-mix(in srgb, var(--tint) 35%, #000) 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06), 0 30px 60px rgba(0, 0, 0, .45);
    }
    .spot .stage { position: relative; display: grid; place-items: center; }
    .spot .stage { padding: 28px 10px 28px 32px; }
    .spot .stage .cover { width: 100%; max-width: 560px; height: auto; border-radius: 14px; box-shadow: 0 30px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08); transition: transform .45s cubic-bezier(.2, .7, .2, 1); }
    a.spot:hover .stage .cover { transform: translateY(-3px) rotate(-.4deg); }
    .spot .info { display: flex; flex-direction: column; justify-content: center; padding: 40px 48px 40px 10px; }
    .spot .kicker { color: var(--champagne); display: inline-flex; align-items: center; gap: 10px; }
    .spot .kicker::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--champagne); box-shadow: 0 0 12px var(--champagne); }
    .spot h1 { font-family: var(--display); font-weight: 600; font-size: clamp(40px, 5vw, 64px); line-height: 1; margin: 14px 0 12px; }
    .spot p { margin: 0 0 22px; font-size: 16px; line-height: 1.6; color: rgba(239, 233, 220, .72); max-width: 420px; }
    .spot .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
    .tag { font-family: var(--ui); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; background: rgba(0, 0, 0, .28); color: rgba(239, 233, 220, .82); border: 1px solid rgba(255, 255, 255, .08); }
    .play-btn {
      align-self: flex-start; display: inline-flex; align-items: center; gap: 12px;
      font-family: var(--ui); font-size: 13px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase;
      padding: 16px 30px; border-radius: 999px; color: #17130c; background: linear-gradient(180deg, var(--champagne-hi), var(--champagne));
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35); transition: transform .2s, box-shadow .2s;
    }
    .play-btn::before { content: ''; width: 0; height: 0; border-left: 10px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    a.spot:hover .play-btn { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(0, 0, 0, .45); }

    /* ---------- filters ---------- */
    .filters { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 20px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      font-family: var(--ui); font-size: 13px; font-weight: 600; letter-spacing: .02em; cursor: pointer;
      padding: 9px 16px; border-radius: 999px; color: var(--mute); background: rgba(255, 248, 230, .04); border: 1px solid var(--hairline);
      transition: color .2s, background .2s, border-color .2s;
    }
    .chip:hover { color: var(--ivory); border-color: var(--hairline-hi); }
    .chip.on { color: #17130c; background: var(--champagne); border-color: var(--champagne); }
    .count { display: flex; align-items: center; gap: 10px; }
    .count .caps { color: var(--mute); }
    .seg { display: flex; border: 1px solid var(--hairline); border-radius: 999px; padding: 3px; background: rgba(255, 248, 230, .03); }
    .seg button {
      font-family: var(--ui); font-size: 12.5px; font-weight: 700; min-width: 40px; padding: 7px 11px; border: 0; border-radius: 999px; cursor: pointer;
      color: var(--mute); background: none;
    }
    .seg button.on { color: #17130c; background: var(--champagne); }

    /* ---------- the library ---------- */
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 16px; }
    .section-head h2 { font-family: var(--display); font-weight: 600; font-size: 30px; margin: 0; }
    .section-head span { color: var(--mute); }
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; padding-bottom: 60px; }
    .box {
      --tint: #2a2620;
      position: relative; display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; text-decoration: none; color: var(--ivory);
      background: var(--onyx-2); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05);
      transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s;
    }
    a.box:hover, a.box:focus-visible { transform: translateY(-5px); box-shadow: inset 0 0 0 1px rgba(205, 180, 135, .55), 0 24px 44px rgba(0, 0, 0, .5); outline: none; }
    .art {
      position: relative; display: grid; place-items: center; aspect-ratio: 3 / 2; overflow: hidden;
      background: radial-gradient(ellipse 80% 80% at 50% 40%, color-mix(in srgb, var(--tint) 100%, #fff 7%), var(--tint) 50%, color-mix(in srgb, var(--tint) 45%, #000) 100%);
    }
    .art .cover { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: transform .45s cubic-bezier(.2, .7, .2, 1); }
    a.box:hover .art .cover { transform: scale(1.05); }
    .new { position: absolute; left: 12px; top: 12px; z-index: 2; font-family: var(--ui); font-size: 10px; font-weight: 800; letter-spacing: .18em; padding: 5px 9px; border-radius: 999px; color: #17130c; background: var(--champagne); }
    .hover-play {
      position: absolute; right: 12px; bottom: 12px; z-index: 2; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
      background: var(--champagne); color: #17130c; opacity: 0; transform: translateY(6px); transition: .25s; box-shadow: 0 8px 18px rgba(0, 0, 0, .4);
    }
    .hover-play::before { content: ''; margin-left: 3px; border-left: 11px solid currentColor; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
    a.box:hover .hover-play, a.box:focus-visible .hover-play { opacity: 1; transform: none; }
    .info-row { padding: 14px 16px 16px; }
    .box h3 { font-family: var(--display); font-weight: 600; font-size: 23px; line-height: 1.1; margin: 0 0 8px; }
    .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .meta .who { display: inline-flex; align-items: center; gap: 6px; font-family: var(--ui); font-size: 12.5px; font-weight: 600; color: rgba(239, 233, 220, .78); }
    .meta .who svg { width: 14px; height: 14px; opacity: .7; }
    .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--mute); }
    .meta .kind { font-family: var(--ui); font-size: 12.5px; color: var(--mute); }
    .empty { grid-column: 1 / -1; padding: 60px 0; text-align: center; font-family: var(--display); font-style: italic; font-size: 22px; color: var(--mute); }


    /* Each game's colour (behind its cover in the spotlight) */
    .t-euchre { --tint: #1d4433; } .t-holdem { --tint: #1c2f4a; } .t-veto { --tint: #4b301c; } .t-gofish { --tint: #173f48; } 
    .t-chess { --tint: #3b2819; } .t-backgammon { --tint: #44291a; } .t-sketch { --tint: #263d32; } .t-chefskiss { --tint: #1b3b42; } 
    .t-insidejob { --tint: #1b2c45; } .t-crown { --tint: #34203c; } .t-hollow { --tint: #3a2d21; } .t-blackjack { --tint: #173d2c; } 
    .t-baccarat { --tint: #44161e; } .t-checkers { --tint: #1a372e; } .t-yacht { --tint: #18263d; } .t-crazy8 { --tint: #17393b; } 
    .t-skyline { --tint: #1b2740; } .t-lowtide { --tint: #12304a; } .t-trio { --tint: #2a2d33; } .t-fourup { --tint: #1d3346; } 
    .t-seedstones { --tint: #3a2a1c; } .t-sonar { --tint: #12282c; } .t-milestones { --tint: #1e2a3e; } .t-wrongnumber { --tint: #2a1f38; } 
    .t-scribble { --tint: #3a2d22; } .t-manor { --tint: #3a1f1c; } .t-warfront { --tint: #162637; } .t-ironroutes { --tint: #1d2f26; } 
    .t-homestead { --tint: #16303a; } .t-wordsmith { --tint: #2c2620; } .t-powerup { --tint: #2f2215; } .t-deepspace { --tint: #18203a; } 
    .t-houserules { --tint: #3a2a1e; } .t-bannerraid { --tint: #2a2a20; } .t-fieldagents { --tint: #2d2f22; } .t-dialitin { --tint: #173338; } 
    .t-pileup { --tint: #2b2f38; } .t-luckystreak { --tint: #1b3a2c; } .t-passpot { --tint: #4a1d1c; } .t-tessera { --tint: #2c2a33; } 
    .t-gearworks { --tint: #2b3238; } .t-redline { --tint: #2a1d1f; } .t-grandprix { --tint: #233a26; } .t-spires { --tint: #26304a; } 
    .t-kaboom { --tint: #3a1f3a; } .t-nestegg { --tint: #1f3a2b; } .t-spoons { --tint: #3d2818; } .t-doubt { --tint: #34182f; } 
    .t-cashout { --tint: #24272d; } .t-hardsell { --tint: #1f3a3a; } 


    footer { border-top: 1px solid var(--hairline); padding: 22px 0 34px; }
    footer .wrap { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-family: var(--ui); font-size: 13px; color: var(--mute); }
    footer a { color: var(--champagne); text-decoration: none; }
    footer .legal { margin-top: 14px; justify-content: center; font-size: 11.5px; letter-spacing: .06em; opacity: .75; }
    .brand .tm { font-size: .62em; letter-spacing: 0; margin-left: .25em; vertical-align: super; line-height: 0; opacity: .8; }

    @media (max-width: 860px) {
      .spot { grid-template-columns: 1fr; }
      .spot .stage { padding: 22px 22px 6px; }
      .spot .info { padding: 6px 26px 30px; }
    }
    @media (max-width: 600px) {
      .wrap { padding: 0 16px; }
      .bar .wrap { height: auto; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; gap: 12px; }
      .join { width: 100%; }
      .join input { flex: 1; width: auto; min-width: 0; }
      .spot { margin-top: 18px; border-radius: 16px; }
      .spot .stage { padding: 16px 16px 4px; }
      .filters { flex-direction: column; align-items: stretch; }
      .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
      .chip { flex: none; }
      .seg { align-self: flex-start; }
      .shelf { grid-template-columns: 1fr 1fr; gap: 12px; }
      .box h3 { font-size: 19px; }
      .info-row { padding: 11px 12px 13px; }
      .meta .dot, .meta .kind { display: none; }
    }

    /* ---------- TV: just the library, every game on one screen ---------- */
    html.tv .join, html.tv .spot, html.tv .filters, html.tv footer, html.tv .hover-play { display: none; }
    html.tv .bar { position: static; }
    html.tv .wrap { max-width: none; padding: 0 3vw; }
    html.tv .section-head { margin-top: 3vh; }
    html.tv .section-head h2 { font-size: 5vh; }
    html.tv .shelf { grid-template-columns: repeat(8, 1fr); gap: 1.6vh; }
    html.tv .box h3 { font-size: 3vh; }
    html.tv .meta .kind, html.tv .meta .dot { display: none; }
  </style>
</head>
<body>
  <header class="bar">
    <div class="wrap">
      <a class="brand" href="index.html"><img src="icon.svg" alt=""><span>Play On Display<sup class="tm">™</sup></span></a>
      <form class="join" id="joinForm" action="play.html">
        <label for="code">Join a game</label>
        <input id="code" name="room" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code">
        <button type="submit">Join</button>
      </form>
    </div>
  </header>

  <main class="wrap">
    <a class="spot" id="spot"></a>

    <div class="filters">
      <div class="chips" id="cats"></div>
      <div class="count"><span class="caps">Players</span><div class="seg" id="players"></div></div>
    </div>

    <div class="section-head"><h2 id="libTitle">All games</h2><span class="caps" id="libCount"></span></div>
    <div class="shelf" id="shelf"></div>
  </main>

  <footer>
    <div class="wrap">
      <span>Open a game on the TV or tablet · everyone joins by scanning the code with their phone</span>
      <span><a href="play.html">Join without a code</a> · <a href="tv.apk">Android TV app</a></span>
    </div>
    <div class="wrap legal">Play On Display™ is a trademark of Syndaris.</div>
  </footer>

  <script type="module" src="js/tvnav.js?v=61"></script>
  <script type="module">
    import { GAMES } from './js/games.js?v=61';
    import { coverSVG } from './js/covers.js?v=61';

    const ids = ['hardsell', 'pileup', 'luckystreak', 'fieldagents', 'dialitin', 'houserules', 'deepspace', 'bannerraid', 'passpot', 'nestegg', 'kaboom', 'spires', 'gearworks', 'euchre', 'holdem', 'blackjack', 'baccarat', 'cashout', 'yacht', 'wrongnumber', 'scribble', 'spoons', 'doubt', 'crazy8', 'lowtide', 'skyline', 'wordsmith', 'homestead', 'warfront', 'ironroutes', 'grandprix', 'redline', 'tessera', 'chess', 'powerup', 'checkers', 'backgammon', 'fourup', 'seedstones', 'trio', 'sonar', 'milestones', 'manor', 'crown', 'hollow', 'insidejob', 'sketch', 'chefskiss', 'veto', 'gofish'];
    const KIND = {
      euchre: 'cards', holdem: 'casino', blackjack: 'casino', baccarat: 'casino', yacht: 'dice', chess: 'board', powerup: 'board', hardsell: 'party', deepspace: 'cards', houserules: 'cards', bannerraid: 'board', fieldagents: 'party', dialitin: 'party', pileup: 'cards', luckystreak: 'cards', passpot: 'dice', tessera: 'board', gearworks: 'cards', redline: 'board', grandprix: 'board', spires: 'cards', kaboom: 'party', nestegg: 'cards', checkers: 'board',
      backgammon: 'board', crown: 'roles', hollow: 'roles', insidejob: 'party', sketch: 'party', chefskiss: 'party', veto: 'cards', gofish: 'cards', spoons: 'party', doubt: 'party', cashout: 'dice', crazy8: 'cards', skyline: 'board', lowtide: 'cards', trio: 'board', fourup: 'board', seedstones: 'board', sonar: 'board', milestones: 'cards', wrongnumber: 'party', scribble: 'party', manor: 'roles', warfront: 'board', ironroutes: 'board', homestead: 'board', wordsmith: 'board',
    };
    const KIND_NAME = { all: 'All games', cards: 'Card games', casino: 'Casino', board: 'Board games', dice: 'Dice', party: 'Party', roles: 'Hidden roles' };
    const NEW = new Set(['hardsell', 'deepspace', 'houserules', 'bannerraid', 'fieldagents', 'dialitin', 'pileup', 'luckystreak', 'passpot', 'tessera', 'gearworks', 'redline', 'grandprix', 'spires', 'kaboom', 'nestegg', 'powerup', 'wordsmith', 'homestead', 'ironroutes', 'warfront', 'manor', 'scribble', 'wrongnumber', 'sonar', 'milestones', 'trio', 'fourup', 'seedstones', 'lowtide', 'skyline', 'crazy8', 'spoons', 'doubt', 'cashout', 'yacht', 'checkers']);
    const PLAYERS = [['any', 'Any'], ['1', '1'], ['2', '2'], ['3-4', '3–4'], ['5-8', '5–8'], ['9-10', '9+']];
    const people = '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="6" cy="5" r="2.6"/><path d="M1 14c0-3 2.2-5 5-5s5 2 5 5z"/><circle cx="11.5" cy="5.5" r="2.1" opacity=".6"/><path d="M11 9.2c2.4.2 4 2 4 4.8h-3c0-1.9-.4-3.5-1-4.8z" opacity=".6"/></svg>';
    const range = G => (G.min === G.max ? `${G.min}` : `${G.min}–${G.max}`);
    const desc = G => { const d = G.blurb.split(' · ').slice(1).join(' · '); return d ? d[0].toUpperCase() + d.slice(1) : ''; };

    // Remember the filters between visits (per device; works without it too).
    let cat = 'all', who = 'any';
    try { ({ cat = 'all', who = 'any' } = JSON.parse(localStorage.getItem('pod.home.filters')) || {}); } catch {}
    // The TV shows the whole library (no filter bar there).
    const onTV = /PlayOnDisplayTV/.test(navigator.userAgent) || new URLSearchParams(location.search).has('tv') || document.documentElement.classList.contains('tv') || (() => { try { return sessionStorage.getItem('pod.tv') === '1'; } catch { return false; } })();
    if (onTV) { cat = 'all'; who = 'any'; }


    // ---- Spotlight: the game this screen last played, otherwise the newest game.
    let last = null;
    try { last = JSON.parse(localStorage.getItem('syndaris.table.v2'))?.gameId; } catch {}
    const spotId = GAMES[last] ? last : 'yacht';
    const S = GAMES[spotId];
    const spot = document.getElementById('spot');
    spot.className = `spot t-${spotId}`;
    spot.href = `table.html?game=${spotId}`;
    spot.innerHTML = `<div class="stage"></div>
      <div class="info">
        <span class="caps kicker">${GAMES[last] ? 'Jump back in' : 'New on the table'}</span>
        <h1>${S.name}</h1>
        <p>${desc(S)}.</p>
        <div class="tags"><span class="tag">${range(S)} players</span><span class="tag">${KIND_NAME[KIND[spotId]]}</span>${S.noBots ? '' : '<span class="tag">Bots welcome</span>'}</div>
        <span class="play-btn">Play</span>
      </div>`;
    spot.querySelector('.stage').innerHTML = coverSVG(spotId);

    // ---- Filters
    const cats = document.getElementById('cats');
    cats.innerHTML = Object.entries(KIND_NAME).map(([k, t]) => `<button class="chip" data-cat="${k}" type="button">${t}</button>`).join('');
    const seg = document.getElementById('players');
    seg.innerHTML = PLAYERS.map(([k, t]) => `<button data-who="${k}" type="button">${t}</button>`).join('');
    cats.onclick = e => { const b = e.target.closest('[data-cat]'); if (b) { cat = b.dataset.cat; draw(); } };
    seg.onclick = e => { const b = e.target.closest('[data-who]'); if (b) { who = b.dataset.who; draw(); } };

    const fits = G => {
      if (who === 'any') return true;
      const [a, b = a] = who.split('-').map(Number);
      return G.min <= b && G.max >= a;
    };

    // ---- Library
    const shelf = document.getElementById('shelf');
    const tiles = {};
    ids.forEach(id => {
      const G = GAMES[id];
      const box = document.createElement('a');
      box.className = `box t-${id}`;
      box.href = `table.html?game=${id}`;
      box.innerHTML = `<div class="art">${NEW.has(id) ? '<span class="new">NEW</span>' : ''}<span class="hover-play" aria-hidden="true"></span></div>
        <div class="info-row"><h3>${G.name}</h3>
          <div class="meta"><span class="who">${people}${range(G)}</span><i class="dot"></i><span class="kind">${KIND_NAME[KIND[id]]}</span></div></div>`;
      box.title = desc(G);
      box.querySelector('.art').insertAdjacentHTML('afterbegin', coverSVG(id));
      tiles[id] = box;
    });

    function draw() {
      try { localStorage.setItem('pod.home.filters', JSON.stringify({ cat, who })); } catch {}
      cats.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.cat === cat));
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.who === who));
      const show = ids.filter(id => (cat === 'all' || KIND[id] === cat) && fits(GAMES[id]));
      shelf.replaceChildren(...show.map(id => tiles[id]));
      if (!show.length) shelf.innerHTML = '<p class="empty">No games match — try another filter.</p>';
      document.getElementById('libTitle').textContent = KIND_NAME[cat];
      document.getElementById('libCount').textContent = `${show.length} ${show.length === 1 ? 'game' : 'games'}${who !== 'any' ? ` · ${PLAYERS.find(p => p[0] === who)[1]} players` : ''}`;
    }
    draw();

    // ---- Quick join: four letters straight to the phone page.
    const code = document.getElementById('code');
    code.addEventListener('input', () => { code.value = code.value.toUpperCase().replace(/[^A-Z]/g, ''); });
    document.getElementById('joinForm').addEventListener('submit', e => {
      e.preventDefault();
      const room = code.value.trim();
      location.href = /^[A-Z]{4}$/.test(room) ? `play.html?room=${room}` : 'play.html';
    });
  </script>
</body>
</html>
