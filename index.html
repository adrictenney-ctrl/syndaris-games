<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b2d1e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <title>Play On Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=DM+Serif+Display&family=Noto+Sans+Symbols+2&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cards.css?v=28">
  <link rel="stylesheet" href="css/chefskiss.css?v=28">
  <link rel="stylesheet" href="css/insidejob.css?v=28">
  <style>
    body { min-height: 100%; padding: 36px 20px 48px; }
    main { max-width: 1040px; margin: 0 auto; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
    h1 { font-family: var(--display); font-weight: 400; color: var(--ivory); font-size: clamp(40px, 7vw, 68px); letter-spacing: .04em; margin: 0; line-height: 1; }
    .tag { font-family: var(--serif); font-style: italic; color: var(--gold-ink); font-size: 19px; margin: 8px 0 0; }
    a.join {
      font-family: var(--display); font-size: 19px; letter-spacing: .04em; text-decoration: none; color: var(--ivory);
      padding: 11px 20px 13px; border: 1px solid var(--gold-faint); border-radius: 8px; background: rgba(8, 28, 19, .35);
    }
    a.join small { display: block; font-family: var(--ui); font-size: 12px; letter-spacing: .04em; color: var(--gold-ink); margin-top: 2px; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-ink); margin: 0 0 14px; }

    /* The shelf: each game is a box, dressed in its own table */
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
    .box {
      position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-height: 250px;
      padding: 20px; border-radius: 10px; overflow: hidden; text-decoration: none; color: var(--ivory);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .08);
      transition: transform .2s, box-shadow .2s;
    }
    a.box:hover { transform: translateY(-4px); box-shadow: 0 20px 38px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .14); }
    .box::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, .5)); pointer-events: none; }
    .box > * { position: relative; z-index: 1; }
    /* The art sits above the name in the normal flow, so the two can never overlap. */
    .box .cards { position: relative; flex: none; height: 100px; width: 200px; margin: auto auto 16px; z-index: 0; }
    .box .cards .card { --cw: 62px; position: absolute; left: 50%; top: 50%; }
    .box h2 { font-family: var(--display); font-weight: 400; font-size: 27px; margin: 0; letter-spacing: .02em; }
    .box p { font-family: var(--serif); font-style: italic; font-size: 16px; color: rgba(245, 238, 221, .8); margin: 4px 0 0; }
    .box .play { margin-top: 14px; font-size: 12px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--brass-hi); }
    .box.soon { cursor: default; opacity: .8; }
    .box.soon .play { color: #7a6c58; }

    .t-euchre { background: radial-gradient(ellipse at 50% 35%, #226a47, #185236 55%, #0b2d1e); }
    .t-holdem { background: radial-gradient(ellipse at 50% 35%, #2c5888, #1c3c64 55%, #0b1b33); }
    .t-veto { background: repeating-linear-gradient(90deg, rgba(40, 18, 4, .4) 0 2px, transparent 2px 64px), linear-gradient(180deg, #9a6438, #7a4826); }
    .t-chess { background: linear-gradient(180deg, #4b2a17, #33190c); }
    .t-backgammon { background: linear-gradient(180deg, #7a4322, #4d2812); }
    .bgmini { width: 170px !important; height: 104px !important; background: radial-gradient(ellipse, #276a46, #1a4e33); border: 6px solid #5a321a; border-radius: 6px; box-shadow: 0 8px 18px rgba(0, 0, 0, .5); overflow: hidden; }
    .bgmini i { position: absolute; top: 0; width: 14%; height: 45%; background: #efe2c3; clip-path: polygon(0 0, 100% 0, 50% 100%); }
    .bgmini i:nth-child(1) { left: 2%; } .bgmini i:nth-child(2) { left: 18%; background: #9b3029; } .bgmini i:nth-child(3) { left: 34%; }
    .bgmini i:nth-child(4) { left: 52%; background: #9b3029; } .bgmini i:nth-child(5) { left: 68%; } .bgmini i:nth-child(6) { left: 84%; background: #9b3029; }
    .bgmini b { position: absolute; width: 22px; height: 22px; border-radius: 50%; translate: -50% -50%; }
    .bgmini b.w { background: radial-gradient(circle at 40% 35%, #fffbf2, #cdbf9f); box-shadow: inset 0 0 0 3px #f7f0e1, 0 2px 3px rgba(0,0,0,.5); }
    .bgmini b.b { background: radial-gradient(circle at 40% 35%, #4d4549, #0d0b0d); box-shadow: inset 0 0 0 3px #1a171a, 0 2px 3px rgba(0,0,0,.5); }
    .t-chess .cards { background: conic-gradient(#e7cf9e 25%, #8e5b33 0 50%, #e7cf9e 0 75%, #8e5b33 0) 0 0 / 50px 50px; width: 150px; height: 100px; border: 4px solid #5a3218; box-shadow: 0 0 0 1px #c9a55a, 0 8px 18px rgba(0, 0, 0, .5); }
    .cpc { position: absolute; top: 50%; transform: translate(-50%, -50%); font-family: 'Noto Sans Symbols 2', 'Segoe UI Symbol', serif; font-size: 62px; line-height: 1; }
    .cpc.w { color: #faf3e3; -webkit-text-stroke: 1.2px #2a2018; text-shadow: 0 3px 5px rgba(0, 0, 0, .55); }
    .cpc.b { color: #1c1918; -webkit-text-stroke: 1px rgba(245, 232, 205, .65); text-shadow: 0 3px 5px rgba(0, 0, 0, .55); }
    .t-gofish { background: radial-gradient(ellipse at 50% 35%, #2a8796, #145867 55%, #08303d); }
    .t-gofish .pad {
      position: absolute; width: 54px; aspect-ratio: 1; border-radius: 50%; z-index: 0;
      background: radial-gradient(circle at 38% 34%, #7bbd62, #3f7d3a);
      -webkit-mask: conic-gradient(from 25deg, transparent 0 28deg, #000 28deg); mask: conic-gradient(from 25deg, transparent 0 28deg, #000 28deg);
    }
    .t-sketch { background: repeating-linear-gradient(0deg, rgba(220, 240, 220, .18) 0 1px, transparent 1px 22px), repeating-linear-gradient(90deg, rgba(220, 240, 220, .18) 0 1px, transparent 1px 22px), linear-gradient(180deg, #1f5c43, #133c2b); }
    .skmini { width: 136px !important; height: 84px !important; padding-top: 8px; background: #fbf7ec; border-radius: 4px; rotate: -3deg; box-shadow: 0 8px 18px rgba(0, 0, 0, .5); }
    .skmini::before { content: ""; position: absolute; left: 6px; right: 6px; top: 3px; height: 6px; background: radial-gradient(circle 2.5px at 50% 50%, #3a3a3a 70%, transparent 75%) 0 0 / 12px 100% repeat-x; }
    .skmini svg { display: block; width: 100%; height: 100%; }
    .t-insidejob { background: repeating-linear-gradient(0deg, rgba(200, 225, 255, .16) 0 1px, transparent 1px 20px), repeating-linear-gradient(90deg, rgba(200, 225, 255, .16) 0 1px, transparent 1px 20px), linear-gradient(180deg, #1b4a86, #123563); }
    .ijmini { display: flex; align-items: center; justify-content: center; }
    .ijmini .pchip { --chip: 50px; margin: 0 -6px; }
    .ijmini .pchip:nth-child(odd) { transform: translateY(-10px); }
    .t-chefskiss { background: radial-gradient(ellipse at 50% 35%, #1d5865, #0c2a33 70%); }
    .ckmini { --w: 66px; width: 170px !important; height: 104px !important; }
    .ckmini .ck-card { position: absolute; left: 50%; top: 50%; }
    .ckmini .ck-card.r { transform: translate(-82%, -50%) rotate(-9deg); }
    .ckmini .ck-card.i { transform: translate(-18%, -46%) rotate(8deg); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Play On Display</h1>
        <p class="tag">Pick a game for the table. Everyone's hand goes on their phone.</p>
      </div>
      <a class="join" href="play.html">Join with my phone<small>Scan the table's code or type its room code</small></a>
    </header>
    <p class="eyebrow">The games</p>
    <div class="shelf" id="shelf"></div>
  </main>
  <script type="module" src="js/tvnav.js?v=28"></script>
  <script type="module">
    import { GAMES } from './js/games.js?v=28';
    import { cardEl } from './js/cards.js?v=28';
    import { face } from './js/ck-face.js?v=28';
    const art = {
      euchre: ['JH', 'JD', 'AH'], holdem: ['AS', 'AH', 'KD'], veto: ['R-7-1', 'T-d2-2', 'W-wild-3'], gofish: ['7C', '7H', '7S'],
    };
    const shelf = document.getElementById('shelf');
    for (const id of ['euchre', 'holdem', 'veto', 'gofish', 'chess', 'backgammon', 'sketch', 'chefskiss', 'insidejob']) {
      const G = GAMES[id];
      const box = document.createElement('a');
      box.className = `box t-${id}`;
      box.href = `table.html?game=${id}`;
      box.innerHTML = `${id === 'gofish' ? '<i class="pad" style="left:14px;top:16px"></i><i class="pad" style="right:18px;top:120px;width:38px;rotate:140deg"></i>' : ''}
        <div class="cards"></div><h2>${G.name}</h2><p>${G.blurb}</p><span class="play">Set up the table →</span>`;
      const fan = box.querySelector('.cards');
      if (id === 'chess') fan.innerHTML = '<span class="cpc w" style="left:34%">♚︎</span><span class="cpc b" style="left:66%">♛︎</span>';
      else if (id === 'backgammon') { fan.className = 'cards bgmini'; fan.innerHTML = '<i></i><i></i><i></i><i></i><i></i><i></i><b class="w" style="left:16%;top:22%"></b><b class="w" style="left:16%;top:40%"></b><b class="b" style="left:84%;top:78%"></b><b class="b" style="left:84%;top:60%"></b><b class="b" style="left:50%;top:22%"></b>'; }
      else if (id === 'sketch') { fan.className = 'cards skmini'; fan.innerHTML = '<svg viewBox="0 0 160 104"><path d="M30 78 Q 40 30 80 34 Q 120 38 126 74" fill="none" stroke="#e0382c" stroke-width="5" stroke-linecap="round"/><circle cx="80" cy="60" r="16" fill="none" stroke="#1d1b1a" stroke-width="4"/><path d="M74 56h1M86 56h1M73 66q7 6 14 0" stroke="#1d1b1a" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M22 92 L 140 92" stroke="#2f7de1" stroke-width="4" stroke-linecap="round"/></svg>'; }
      else if (id === 'insidejob') {
        fan.className = 'cards ijmini';
        fan.innerHTML = '<span class="pchip c-white"><b>100</b></span><span class="pchip c-yellow"><b>200</b></span><span class="pchip c-orange"><b>300</b></span><span class="pchip c-red"><b>400</b></span>';
      }
      else if (id === 'chefskiss') {
        fan.className = 'cards ckmini';
        fan.innerHTML = face({ kind: 'r', t: 'Totally adorable', d: '' }) + face({ kind: 'i', t: 'A goat in pajamas', d: '' });
      }
      else art[id].forEach((c, i) => {
        const el = cardEl(c);
        el.style.transform = `translate(-50%, -50%) translateX(${(i - 1) * 34}px) rotate(${(i - 1) * 12}deg) translateY(${Math.abs(i - 1) * 6}px)`;
        fan.appendChild(el);
      });
      shelf.appendChild(box);
    }
  </script>
</body>
</html>
