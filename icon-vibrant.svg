<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Vibrant style's logo: printed like the bright game boxes (solid colour, sunburst, white rims, dark outlines). -->
  <defs>
    <clipPath id="tile"><rect x="2" y="2" width="60" height="60" rx="14"/></clipPath>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="2" cy="2" r=".75" fill="#fff"/></pattern>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#6c4cf2"/>
  <g clip-path="url(#tile)">
    <path d="M32 30 L32 -40 L56 -32 Z M32 30 L80 -10 L92 14 Z M32 30 L96 40 L88 62 Z M32 30 L70 96 L46 100 Z M32 30 L10 100 L-12 90 Z M32 30 L-30 60 L-34 36 Z M32 30 L-30 4 L-20 -18 Z M32 30 L4 -40 L22 -44 Z" fill="#fff" opacity=".12"/>
    <rect x="30" y="34" width="34" height="30" fill="url(#dots)" opacity=".22"/>
    <path d="M0 50 Q32 44 64 50 V64 H0 Z" fill="#4a2bc4" opacity=".55"/>
  </g>
  <!-- back card -->
  <g transform="rotate(-13 24 32)">
    <rect x="11" y="13" width="25" height="35" rx="4" fill="#1b1352" transform="translate(0 2)" opacity=".45"/>
    <rect x="11" y="13" width="25" height="35" rx="4" fill="#3f86f2" stroke="#1b1352" stroke-width="2"/>
    <rect x="14" y="16" width="19" height="29" rx="2.5" fill="none" stroke="#fff" stroke-width="1.6"/>
    <path d="M23.5 23 l4 7.5 -4 7.5 -4 -7.5 Z" fill="#fff"/>
  </g>
  <!-- front card with the play coin -->
  <g transform="rotate(9 39 33)">
    <rect x="26" y="14" width="26" height="36" rx="4" fill="#1b1352" transform="translate(0 2.5)" opacity=".45"/>
    <rect x="26" y="14" width="26" height="36" rx="4" fill="#fff" stroke="#1b1352" stroke-width="2"/>
    <text x="29.5" y="22.5" font-family="'Lilita One', 'Arial Black', sans-serif" font-size="7" fill="#ef4a4f">A</text>
    <circle cx="39" cy="32.5" r="8.6" fill="#ffd84a" stroke="#1b1352" stroke-width="2"/>
    <path d="M36.4 28.2 L43.4 32.5 L36.4 36.8 Z" fill="#1b1352" stroke="#1b1352" stroke-width="1" stroke-linejoin="round"/>
  </g>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1b1352" stroke-width="2.5"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
</svg>
