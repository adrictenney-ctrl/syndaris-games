<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b2d1e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <title>Syndaris Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=DM+Serif+Display&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cards.css?v=5">
  <link rel="stylesheet" href="css/table.css?v=5">
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>
  <div id="felt">
    <div id="print" aria-hidden="true"></div>
    <div id="lamp" aria-hidden="true"></div>
    <div id="watermark"></div>
    <div id="center">
      <div id="kitty"></div>
      <div id="trick"></div>
    </div>

    <div id="lobby">
      <div class="mirror" aria-hidden="true">Room <b class="roomcode"></b></div>
      <div class="lobby-main">
        <div class="tent">
          <div id="qr"></div>
          <p class="tent-cap">Scan to take a seat</p>
          <p class="tent-room">Room <b class="roomcode"></b></p>
        </div>
        <div class="lobby-info">
          <p class="eyebrow">Choose a game</p>
          <div id="gamePick" class="gamepick"></div>
          <div class="settings" id="settings"></div>
          <p class="url" id="joinUrl"></p>
          <p class="warn" id="localWarn" hidden>This page is open on localhost, which phones can't reach. Open it from the web address instead.</p>
          <button id="startBtn" class="big" disabled>Waiting for players</button>
        </div>
      </div>
    </div>

    <div id="overlay" hidden></div>

    <div id="toolbar">
      <span id="netstatus" class="pill">Connecting…</span>
      <button id="btnOrient" class="tool" title="Switch between flat (around the table) and upright (TV)">Flat</button>
      <button id="btnFull" class="tool" title="Full screen">Full screen</button>
      <button id="btnEnd" class="tool" title="End game and return to the lobby" hidden>End game</button>
    </div>
  </div>
  <div id="rail" aria-hidden="true"><div class="stitch"></div><div class="brass"></div></div>

  <template id="seatTpl">
    <div class="seat">
      <div class="bubble"></div>
      <div class="fan"></div>
      <div class="plate">
        <div class="who"><span class="dot"></span><span class="name"></span><span class="badges"></span></div>
        <div class="meta"></div>
        <div class="seat-actions">
          <button class="addbot">Add a bot</button>
          <button class="kick">Remove</button>
          <button class="takeover">Let a bot play</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="js/table.js?v=5"></script>
</body>
</html>
