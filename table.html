<body>
  <div id="felt">
    <div id="decor" aria-hidden="true"></div>
    <div id="print" aria-hidden="true"></div>
    <div id="lamp" aria-hidden="true"></div>
    <div id="watermark"></div>
    <div id="center">
      <div id="kitty"></div>
      <div id="trick"></div>
    </div>

    <div id="lobby">
      <div class="mirror" aria-hidden="true">Room <b class="roomcode"></b></div>
      <div class="lobby-main">
        <div class="tent">
          <div id="qr"></div>
          <p class="tent-cap">Scan to take a seat</p>
          <p class="tent-room">Room <b class="roomcode"></b></p>
          <p class="tent-note">Any Wi-Fi or cellular works</p>
        </div>
        <div class="lobby-info">
          <a class="eyebrow back" id="allGames" href="index.html">← All games</a>
          <h1 class="game-title" id="gameTitle"></h1>
          <p class="game-blurb" id="gameBlurb"></p>
          <div class="settings" id="settings"></div>
          <p class="url" id="joinUrl"></p>
          <p class="warn" id="localWarn" hidden>This page is open on localhost, which phones can't reach. Open it from the web address instead.</p>
          <button id="startBtn" class="big" disabled>Waiting for players</button>
        </div>
      </div>
    </div>

    <div id="overlay" hidden></div>

    <button id="btnTool" class="switch" hidden></button>
    <div id="toolbar">
      <span id="netstatus" class="pill">Connecting…</span>
      <label class="sizer" id="sizer"><span>Card size</span><input type="range" id="cardSize" min="0.8" max="1.8" step="0.05" value="1" aria-label="Card size on the table"></label>
      <button id="btnOrient" class="tool" title="Switch between flat (around the table) and upright (TV)">Flat</button>
      <button id="btnFull" class="tool" title="Full screen">Full screen</button>
      <button id="btnEnd" class="tool" title="End game and return to the lobby" hidden>End game</button>
    </div>
  </div>
  <div id="rail" aria-hidden="true"><div class="stitch"></div><div class="brass"></div></div>

  <template id="seatTpl">
    <div class="seat">
      <div class="bubble"></div>
      <div class="fan"></div>
      <div class="plate">
        <div class="who"><span class="dot"></span><span class="name"></span><span class="badges"></span></div>
        <div class="meta"></div>
        <div class="seat-actions">
          <button class="addbot">Add a bot</button>
          <button class="kick">Remove</button>
          <button class="takeover">Let a bot play</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="js/tvnav.js?v=58"></script>
  <script type="module" src="js/table.js?v=58"></script>
</body>
</html>
