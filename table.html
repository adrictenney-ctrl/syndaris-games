  <script>
    // Parent Controls: a game turned off on this screen never opens. Runs before the table loads,
    // so nothing starts and no phones can join. (A saved game of a turned-off game is set aside.)
    (() => {
      try {
        const pc = JSON.parse(localStorage.getItem('pod.parental') || 'null');
        if (!pc || !pc.on || !Array.isArray(pc.games) || !pc.games.length) return;
        const want = new URLSearchParams(location.search).get('game');
        const s = JSON.parse(localStorage.getItem('syndaris.table.v2') || 'null');
        const off = id => pc.games.includes(id);
        if (want && off(want)) return location.replace('index.html?blocked=' + encodeURIComponent(want));
        if (s && off(s.gameId)) {
          if (!want) return location.replace('index.html?blocked=' + encodeURIComponent(s.gameId));
          s.game = null;                     // opening another game: the turned-off one doesn't carry on
          localStorage.setItem('syndaris.table.v2', JSON.stringify(s));
        }
      } catch {}
    })();
  </script>

<body>
  <div id="felt">
    <div id="decor" aria-hidden="true"></div>
    <div id="print" aria-hidden="true"></div>
    <div id="lamp" aria-hidden="true"></div>
    <div id="watermark"></div>
    <div id="center">
      <div id="kitty"></div>
      <div id="trick"></div>
    </div>

    <div id="lobby">
      <div class="mirror" aria-hidden="true">Room <b class="roomcode"></b></div>
      <div class="lobby-main">
        <div class="tent">
          <div id="qr"></div>
          <p class="tent-cap">Scan to take a seat</p>
          <p class="tent-room">Room <b class="roomcode"></b></p>
          <p class="tent-note">Any Wi-Fi or cellular works</p>
        </div>
        <div class="lobby-info">
          <a class="eyebrow back" id="allGames" href="index.html">← All games</a>
          <h1 class="game-title" id="gameTitle"></h1>
          <p class="game-blurb" id="gameBlurb"></p>
          <button type="button" class="rules-btn" id="rulesBtn" aria-haspopup="dialog" aria-controls="rulesPanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 7.5h8M8 11h6"/></svg>How to play</button>
          <div class="settings" id="settings"></div>
          <p class="url" id="joinUrl"></p>
          <p class="warn" id="localWarn" hidden>This page is open on localhost, which phones can't reach. Open it from the web address instead.</p>
          <button id="startBtn" class="big" disabled>Waiting for players</button>
        </div>
      </div>
    </div>

    <div id="overlay" hidden></div>

    <div id="rulesPanel" class="rules-panel" role="dialog" aria-modal="true" aria-labelledby="rulesTitle" hidden></div>

    <button id="btnTool" class="switch" hidden></button>
    <div id="toolbar">
      <div id="qrMini" title="Scan to rejoin"><div class="qr"></div><span>Scan to rejoin · <b class="roomcode"></b></span></div>
      <span id="netstatus" class="pill">Connecting…</span>
      <label class="sizer" id="sizer"><span>Card size</span><input type="range" id="cardSize" min="0.8" max="1.8" step="0.05" value="1" aria-label="Card size on the table"></label>
      <button id="btnOrient" class="tool" title="Switch between flat (around the table) and upright (TV)">Flat</button>
      <button id="btnFull" class="tool" title="Full screen">Full screen</button>
      <button id="btnEnd" class="tool" title="End game and return to the lobby" hidden>End game</button>
    </div>
  </div>
  <div id="rail" aria-hidden="true"><div class="stitch"></div><div class="brass"></div></div>

  <template id="seatTpl">
    <div class="seat">
      <div class="bubble"></div>
      <div class="fan"></div>
      <div class="plate">
        <div class="who"><span class="dot"></span><span class="name"></span><span class="badges"></span></div>
        <div class="meta"></div>
        <div class="seat-actions">
          <button class="addbot">Add a bot</button>
          <button class="kick">Remove</button>
          <button class="takeover">Let a bot play</button>
        </div>
      </div>
    </div>
  </template>
